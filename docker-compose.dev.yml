services:
  postgres:
    image: postgres:16-alpine
    container_name: roomie-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomie_local
      POSTGRES_USER: roomie_local
      POSTGRES_PASSWORD: ${ROOMIE_DB_PASSWORD:?Set ROOMIE_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - roomie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomie_local -d roomie_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomie_postgres_data:
